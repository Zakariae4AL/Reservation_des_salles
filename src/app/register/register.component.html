
<div class="bg-white rounded-lg py-5">
    <div class="container flex flex-col mx-auto bg-white rounded-lg pt-12 my-5">
      <div class="flex justify-center w-full h-full my-auto xl:gap-14 lg:justify-normal md:gap-5 draggable">
        <div class="flex items-center justify-center w-full lg:p-12">
          <div class="flex items-center xl:p-10">
            <form
              class="flex flex-col w-full h-full pb-6 text-center bg-white rounded-3xl"
              (ngSubmit)="onSubmit()"
              #inscriptionForm="ngForm"
            >
              <h3 class="mb-3 text-4xl font-extrabold text-dark-grey-900">Créer un compte</h3>
              <p class="mb-4 text-grey-700">Veuillez renseigner vos informations pour vous inscrire</p>
  
              <!-- Nom Complet -->
              <label for="nomComplet" class="mb-2 text-sm text-start text-grey-900">Nom complet*</label>
              <input
                id="nomComplet"
                name="nomComplet"
                type="text"
                placeholder="John Doe"
                required
                [(ngModel)]="user.nomComplet"
                class="flex items-center w-full px-5 py-4 mb-7 text-sm font-medium outline-none focus:bg-grey-400 placeholder:text-grey-700 bg-grey-200 text-dark-grey-900 rounded-2xl"
              />
  
              <!-- Email -->
              <label for="email" class="mb-2 text-sm text-start text-grey-900">Email*</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="mail@loopple.com"
                required
                [(ngModel)]="user.email"
                class="flex items-center w-full px-5 py-4 mb-7 text-sm font-medium outline-none focus:bg-grey-400 placeholder:text-grey-700 bg-grey-200 text-dark-grey-900 rounded-2xl"
              />
  
              <!-- Mot de Passe -->
              <label for="password" class="mb-2 text-sm text-start text-grey-900">Mot de passe*</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter a password"
                required
                [(ngModel)]="user.password"
                class="flex items-center w-full px-5 py-4 mb-7 text-sm font-medium outline-none focus:bg-grey-400 placeholder:text-grey-700 bg-grey-200 text-dark-grey-900 rounded-2xl"
              />
  
              <!-- Role -->
              <label for="role" class="mb-2 text-sm text-start text-grey-900">Role*</label>
              <select
                id="role"
                name="role"
                required
                [(ngModel)]="user.role"
                class="flex items-center w-full px-5 py-4 mb-7 text-sm font-medium outline-none bg-grey-200 text-dark-grey-900 rounded-2xl"
              >
                <option value="" disabled selected>Choisir un rôle</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
              </select>
  
              <button
                type="submit"
                [disabled]="!inscriptionForm.valid"
                class="w-full px-6 py-5 mb-5 text-sm font-bold leading-none text-white transition duration-300 md:w-96 rounded-2xl hover:bg-purple-blue-600 focus:ring-4 focus:ring-purple-blue-100 bg-purple-blue-500"
              >
                S'inscrire
              </button>
  
              <p class="text-sm leading-relaxed text-grey-900">
                Déjà inscrit ?
                <a href="javascript:void(0)" class="font-bold text-grey-700">Se connecter</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
