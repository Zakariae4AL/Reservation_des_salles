spring.application.name=reservationsalles
server.port=${PORT:8080}

# --- Database ---
# Default: an H2 file database in ./data (zero install, for local development).
# Production: use the 'prod' profile with MySQL (see application-prod.properties).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservations;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Security ---
# Must be at least 32 bytes. The default only works outside the 'prod' profile.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.ttl=${JWT_TTL:8h}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
app.security.auth-requests-per-minute=${AUTH_RATE_LIMIT:10}

# --- Demo data (admin@salles.dev / user@salles.dev, password Demo1234) ---
app.seed.demo=${SEED_DEMO:true}

# --- Misc ---
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health
server.error.include-stacktrace=never
logging.level.reservationsalles=INFO
